name: Haskell CI
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        cabal: [ "3.16" ]
        ghc:
          - "9.14"
          - "9.12"
          - "9.10"
          - "9.8"
          - "9.6"
          - "9.4"
          - "9.2"
          - "9.0"
          - "8.10"
          - "8.8"
        os: [ ubuntu-latest ]
    name: build (ghc ${{ matrix.ghc }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/setup@v2
        id: setup-haskell-cabal
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}
      - name: Show resolved versions
        run: |
          echo "GHC:   ${{ steps.setup-haskell-cabal.outputs.ghc-version }}"
          echo "Cabal: ${{ steps.setup-haskell-cabal.outputs.cabal-version }}"
      - name: Cabal Update
        run: |
          cabal update
          cabal freeze
      - uses: actions/cache@v5.0.3
        with:
          path: |
            ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ steps.setup-haskell-cabal.outputs.ghc-version }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ steps.setup-haskell-cabal.outputs.ghc-version }}-
      - name: Build all
        run: cabal build all
      - name: Test all
        run: cabal test all
      - name: Sdist all
        run: cabal sdist all
